<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>BMW M5 Futuristic Card</title>

        <link rel="stylesheet" href="style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@400;600&display=swap"
            rel="stylesheet">
    </head>

    <body>

        <div class="scene">
            <div class="bmw-card" id="bmwCard">

                <!-- IMAGE -->
                <div class="image-box">
                    <img src="https://images.unsplash.com/photo-1617531653332-bd46c24f2068?q=80&w=1200&auto=format&fit=crop"
                        alt="BMW M5">
                </div>

                <span class="badge">M POWER</span>

                <h2 class="model">BMW M5</h2>
                <p class="tagline">Luxury Meets Brutal Performance</p>

                <div class="specs">
                    <div>
                        <h3>617 HP</h3>
                        <p>Power</p>
                    </div>
                    <div>
                        <h3>3.3s</h3>
                        <p>0–100 km/h</p>
                    </div>
                    <div>
                        <h3>V8</h3>
                        <p>Twin Turbo</p>
                    </div>
                </div>

            </div>
        </div>

        <script src="script.js"></script>
    </body>

</html>
